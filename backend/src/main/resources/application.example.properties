# =============================================================================
# Noko Transport — Backend configuration template
# =============================================================================
# 1. Copy this file to application.properties (same folder):
#      cp application.example.properties application.properties
# 2. Replace placeholder values with your local settings.
# 3. Never commit application.properties with real passwords or secrets.
# =============================================================================

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/truck_booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_mysql_password_here
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT — use a long random string (min 32 characters) in production
app.jwt.secret=${JWT_SECRET:REPLACE_WITH_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARACTERS}
app.jwt.expiration-ms=86400000

# Email (optional — set app.mail.enabled=true to send confirmations)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-gmail-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME:your-email@gmail.com}
app.mail.enabled=false

# CORS — add your frontend URL when deploying
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:8080

# Business details
app.business.name=Noko Transport
app.business.phone=+27 82 123 4567
app.business.email=info@nokotransport.co.za
app.business.address=123 Transport Road, Johannesburg, South Africa

# Booking pricing (ZAR per day — used for revenue estimates)
app.booking.daily-rate=3500.00
