  </defs>
  <rect width="800" height="500" fill="url(#bg1)"/>
  <text x="400" y="180" fill="#FF8C00" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">NOKO TRANSPORT</text>
