<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Noko Transport</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card fade-in">
      <div style="text-align:center;margin-bottom:1.5rem">
        <div class="logo-icon" style="margin:0 auto 0.75rem;width:50px;height:50px">🚛</div>
        <h2>Create Account</h2>
        <p class="subtitle">Register to track your bookings</p>
      </div>
      <form id="register-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" required minlength="3">
        </div>
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" class="form-control" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control" required>
          </div>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Register</button>
      </form>
      <p style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--text-muted)">
        Already have an account? <a href="login.html" style="color:var(--secondary);font-weight:600">Sign In</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        Utils.showLoader();
        const res = await window.api.post('/auth/register', {
          username: document.getElementById('username').value,
          name: document.getElementById('name').value,
          phone: document.getElementById('phone').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value
        });
        Auth.saveSession(res.data);
        Utils.toast('Registration successful!', 'success');
        setTimeout(() => window.location.href = 'index.html', 500);
      } catch (err) {
        Utils.toast(err.message, 'error');
      } finally {
        Utils.hideLoader();
      }
    });
  </script>
</body>
</html>
