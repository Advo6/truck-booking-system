<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Noko Transport</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card fade-in">
      <div style="text-align:center;margin-bottom:1.5rem">
        <div class="logo-icon" style="margin:0 auto 0.75rem;width:50px;height:50px">🚛</div>
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to access the admin dashboard</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-control" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
      </form>
      <p style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:var(--text-muted)">
        Don't have an account? <a href="register.html" style="color:var(--secondary);font-weight:600">Register</a>
      </p>
      <p style="text-align:center;margin-top:0.75rem">
        <a href="index.html" style="font-size:0.85rem;color:var(--text-muted)">← Back to Home</a>
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api-client.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script>
    if (Auth.isLoggedIn()) {
      window.location.href = Auth.isAdmin() ? 'dashboard.html' : 'index.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!window.api) {
        Utils.toast('App scripts failed to load. Hard refresh (Ctrl+F5) and ensure the frontend server runs from the frontend folder.', 'error');
        return;
      }
      try {
        Utils.showLoader();
        const res = await window.api.post('/auth/login', {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        });
        Auth.saveSession(res.data);
        Utils.toast('Login successful!', 'success');
        setTimeout(() => {
          window.location.href = res.data.role === 'ADMIN' ? 'dashboard.html' : 'index.html';
        }, 500);
      } catch (err) {
        Utils.toast(err.message, 'error');
      } finally {
        Utils.hideLoader();
      }
    });
  </script>
</body>
</html>
